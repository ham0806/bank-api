services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
